name: Release

# The release is automatic only for a version change pushed to main by berkinory.
run-name: "Opencast release #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths: [project.yml]

permissions:
  contents: write

jobs:
  release-gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check owner version change
        id: check
        env:
          BEFORE: ${{ github.event.before }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "berkinory" ]; then
            echo "Skipping release: version changes are owner-only."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          old_version="$(git show "$BEFORE:project.yml" 2>/dev/null | sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1 || true)"
          new_version="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -n1)"
          if [ "$old_version" = "$new_version" ]; then
            echo "Skipping release: MARKETING_VERSION did not change."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$new_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::project.yml MARKETING_VERSION must be x.y.z; got '$new_version'"
            exit 1
          fi

          echo "Releasing $old_version → $new_version"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: release-gate
    if: needs.release-gate.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Read release metadata
        id: meta
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\([^"]*\)".*/\1/p' project.yml | head -n1)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::project.yml MARKETING_VERSION must be x.y.z; got '$VERSION'"
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "display_name=Opencast"
            echo "bundle_id=com.opencast.app"
            echo "cask_name=opencast"
            echo "dmg_file=Opencast-${VERSION}.dmg"
            echo "zip_file=Opencast-${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

      # Import the Developer ID Application identity into an ephemeral keychain.
      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"
          rm -f "$RUNNER_TEMP/developer-id.p12"

      # Build the Developer ID-signed app into an ephemeral DerivedData dir.
      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          BUNDLE_ID: ${{ steps.meta.outputs.bundle_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Opencast.xcodeproj -scheme Opencast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            PRODUCT_NAME="$DISPLAY_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ONLY_ACTIVE_ARCH=NO build

      - name: Verify universal binary
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          BINARY="$APP/Contents/MacOS/${DISPLAY_NAME}"
          ARCHS="$(lipo -archs "$BINARY")"
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || {
            echo "::error::Release binary is not universal: $ARCHS"
            exit 1
          }

      - name: Notarize and staple app
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          ZIP="$RUNNER_TEMP/${DISPLAY_NAME}.zip"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          SUBMIT_JSON="$RUNNER_TEMP/notary-submit.json"
          WAIT_JSON="$RUNNER_TEMP/notary-wait.json"
          cleanup() { rm -f "$KEY_PATH" "$ZIP" "$SUBMIT_JSON" "$WAIT_JSON"; }
          trap cleanup EXIT

          echo "${NOTARY_KEY_BASE64}" | base64 --decode > "$KEY_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"

          if ! xcrun notarytool submit "$ZIP" \
            --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --output-format json > "$SUBMIT_JSON" 2>&1; then
            cat "$SUBMIT_JSON"
            echo "::error::notarytool upload failed before a submission was created"
            exit 1
          fi
          cat "$SUBMIT_JSON"
          SUBMISSION_ID="$(sed -nE 's/.*"id"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$SUBMIT_JSON" | head -n1)"
          if [ -z "$SUBMISSION_ID" ]; then
            echo "::error::notarytool did not return a submission id"
            exit 1
          fi
          echo "Submission ID: $SUBMISSION_ID"

          if ! xcrun notarytool wait "$SUBMISSION_ID" \
            --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --timeout 25m --output-format json > "$WAIT_JSON" 2>&1; then
            cat "$WAIT_JSON"
            echo "::error::notarization did not finish within 25 minutes; fetching the submission log"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            exit 1
          fi
          cat "$WAIT_JSON"
          STATUS="$(sed -nE 's/.*"status"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$WAIT_JSON" | head -n1)"
          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::notarization finished with status: ${STATUS:-unknown}"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            exit 1
          fi

          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      # Pack the stapled .app + an /Applications symlink into a compressed DMG under dist/.
      - name: Package release archives
        env:
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/${DISPLAY_NAME}.app"
          STAGE="$(mktemp -d)"
          mkdir -p dist
          cp -R "$APP" "$STAGE/"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/${ZIP_FILE}"
          ln -s /Applications "$STAGE/Applications"
          diskutil image create from "$STAGE" --format UDZO --volumeName "$DISPLAY_NAME" "dist/${DMG_FILE}"

      - uses: actions/upload-artifact@v7
        with:
          name: Opencast-${{ steps.meta.outputs.version }}
          path: |
            dist/${{ steps.meta.outputs.dmg_file }}
            dist/${{ steps.meta.outputs.zip_file }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          CHANGELOG_NOTES="$RUNNER_TEMP/changelog-notes.md"
          : > "$CHANGELOG_NOTES"

          if [ -f CHANGELOG.md ]; then
            awk -v version="$VERSION" '
              BEGIN {
                bracketed = "## [" version "]"
                plain = "## " version
              }
              !found && ($0 == bracketed || index($0, bracketed " ") == 1 || $0 == plain || index($0, plain " ") == 1) {
                found = 1
                next
              }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > "$CHANGELOG_NOTES"
          fi

          {
            if [ -s "$CHANGELOG_NOTES" ] && grep -q '[^[:space:]]' "$CHANGELOG_NOTES"; then
              echo "## Changelog"
              echo
              cat "$CHANGELOG_NOTES"
              echo
            fi
            echo "## Requirements"
            echo
            echo "- macOS 15+"
            echo "- Intel or Apple Silicon CPU"
          } > "$NOTES_FILE"

          gh release create "$TAG" \
            "dist/${{ steps.meta.outputs.dmg_file }}" \
            "dist/${{ steps.meta.outputs.zip_file }}" \
            --title "Opencast ${VERSION}" \
            --notes-file "$NOTES_FILE"

      - name: Update Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret not set — skipping cask bump. Add it to enable auto-updates of the tap."
            exit 0
          fi
          SHA="$(shasum -a 256 "dist/${DMG_FILE}" | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${{ github.repository_owner }}/homebrew-brew.git" tap
          CASK_FILE="tap/Casks/${CASK}.rb"
          if [ ! -f "$CASK_FILE" ]; then
            echo "::error::$CASK_FILE not found in tap."
            exit 1
          fi
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Casks/${CASK}.rb"
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "${CASK} ${VERSION}"
            git push
          fi

      # Announce the release in Discord. A Components V2 (flags 32768) card:
      # title + right-aligned Download button, Homebrew install block.
      # No-ops with a warning if the webhook secret isn't set.
      - name: Announce on Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISPLAY_NAME: ${{ steps.meta.outputs.display_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          CASK: ${{ steps.meta.outputs.cask_name }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret not set — skipping Discord announcement."
            exit 0
          fi
          COLOR=3066993
          RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          INSTALL="brew install --cask ${{ github.repository_owner }}/brew/${CASK}"
          # Build with jq so backticks stay literal (printf in single quotes escaped them,
          # which Discord rendered as verbatim backticks instead of a code block).
          jq -n \
            --argjson color "${COLOR}" \
            --arg heading "## 🚀 ${DISPLAY_NAME} ${VERSION}" \
            --arg sub "Now available as the latest Opencast release." \
            --arg install "${INSTALL}" \
            --arg url "${RELEASE_URL}" \
            '{
              flags: 32768,
              components: [
                { type: 17, accent_color: $color, components: [
                  { type: 9,
                    components: [ { type: 10, content: ($heading + "\n" + $sub) } ],
                    accessory: { type: 2, style: 5, label: "Download", url: $url }
                  },
                  { type: 14 },
                  { type: 10, content: ("**Install / update via Homebrew**\n```\n" + $install + "\n```") }
                ] }
              ]
            }' > payload.json
          curl -fsS -X POST -H "Content-Type: application/json" -d @payload.json \
            "${DISCORD_WEBHOOK_URL}?with_components=true"
